[project]
name = "testdesiderata"
version = "0.1.2"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "benomahony", email = "bomarni@googlemail.com" }
]
requires-python = ">=3.12"
dependencies = ["typer>=0.12", "rich>=13"]

[project.scripts]
testdesiderata = "testdesiderata.cli:app"
tdr = "testdesiderata.cli:app"

[project.optional-dependencies]
ai = ["pydantic-ai>=0.1", "pydantic>=2"]
mcp = ["mcp>=1.0"]

[dependency-groups]
dev = [
    "pytest>=8",
    "basedpyright>=1.18",
    "ruff>=0.8",
    "vulture>=2.14",
    "bandit>=1.8",
    "deptry>=0.23",
    "cliqa>=0.1",
    "prek>=0.1",
    "pytest-xdist>=3",
    "pytest-cov>=5",
    "bump-my-version>=1.2.7",
    "zensical>=0.0.24",
]

[tool.pytest.ini_options]
markers = [
    "unit: fast isolated tests using AST parsing only",
    "integration: tests that invoke the CLI or external processes",
]

[tool.bandit]
skips = ["B101", "B405", "B313", "B314"]

[tool.deptry]
known_first_party = ["testdesiderata"]
per_rule_ignores = {"DEP003" = ["mcp"]}

[tool.bumpversion]
current_version = "0.1.2"
commit = true
tag = true
tag_name = "v{new_version}"
message = "Bump version: {current_version} → {new_version}"
pre_commit_hooks = ["uv lock", "git add uv.lock"]

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
